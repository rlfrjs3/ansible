node_exporter_version: "1.12.1"

node_exporter_user: "node_exporter"
node_exporter_group: "node_exporter"

node_exporter_install_dir: "/usr/local/bin"
node_exporter_binary_path: "{{ node_exporter_install_dir }}/node_exporter"

node_exporter_download_url: |
  https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz

node_exporter_archive: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
node_exporter_extract_dir: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64"

node_exporter_port: 9100
